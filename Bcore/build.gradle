plugins {
    id 'com.android.library'
    id 'org.lsposed.lsparanoid'
}

android {
    compileSdk = 35
    buildToolsVersion = '34.0.0'
    namespace "com.Score"
    ndkVersion '29.0.14033849'

    aidlPackagedList "android/app/IServiceConnection.aidl"
    aidlPackagedList "android/accounts/IAccountManagerResponse.aidl"

    defaultConfig {
        minSdk = 21
        targetSdk = 28
        versionCode 1
        versionName "1.0"
        consumerProguardFiles 'consumer-rules.pro'
        
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            keepDebugSymbols = []
            useLegacyPackaging = true
        }
    }
    
    externalNativeBuild {
        cmake {
            path file('./src/main/cpp/CMakeLists.txt')
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    
    buildFeatures {
        aidl true
    }
    
    lint {
        checkReleaseBuilds = false
        abortOnError = false
        warningsAsErrors = false
        disable += ["UnusedResources", "RestrictedApi"]
        textOutput = file("stdout")
        textReport = false
        check += ["NewApi", "InlinedApi"]
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.4'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.4'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
}
