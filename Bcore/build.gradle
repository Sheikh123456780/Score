plugins {
    id 'com.android.library'
    id 'org.lsposed.lsparanoid'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "top.niunaijun.blackbox"

    compileSdkVersion 34
    buildToolsVersion '34'
    ndkVersion '29.0.14033849'

    aidlPackagedList "android/app/IServiceConnection.aidl"
    aidlPackagedList "android/accounts/IAccountManagerResponse.aidl"

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 28

        versionCode 1
        versionName "1.0"

        consumerProguardFiles 'proguard.txt'

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            minifyEnabled true

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }

        release {
            minifyEnabled true

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        aidl true
        prefab true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false

        disable "UnusedResources", "RestrictedApi"

        textOutput "stdout"
        textReport false

        check "NewApi", "InlinedApi"
    }
}

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'

    implementation 'com.github.tiann:FreeReflection:3.2.2'

    implementation 'com.github.CodingGay.BlackReflection:core:1.1.2'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.2'

    compileOnly "com.google.auto.service:auto-service:1.1.1"
    annotationProcessor "com.google.auto.service:auto-service:1.1.1"

    implementation "com.squareup:javapoet:1.13.0"

    implementation "javax.annotation:javax.annotation-api:1.3.2"
}
